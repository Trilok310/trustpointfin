<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tankBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="860" height="320" rx="20" fill="url(#tankBg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Header -->
  <text x="60" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Capital (पूंजी): व्यवसाय का अनिवार्य ईंधन (The Fuel Engine)</text>
  <text x="60" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8">जिस प्रकार ईंधन के बिना कार नहीं चल सकती, उसी प्रकार पूंजी के बिना व्यापार नहीं बढ़ सकता</text>

  <!-- 3 Fuel Pillars -->
  <!-- Pillar 1: Setup Capital -->
  <g transform="translate(60, 130)">
    <rect width="240" height="170" rx="14" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="40" cy="40" r="22" fill="rgba(59, 130, 246, 0.2)" />
    <text x="40" y="47" font-size="20" text-anchor="middle" fill="#60A5FA">🛠️</text>
    <text x="75" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1. Setup Capital</text>
    <text x="20" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">दुकान की स्थापना</text>
    <text x="20" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• दुकान पगड़ी / सिक्योरिटी</text>
    <text x="20" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• मशीनरी व काउंटर उपकरण</text>
    <text x="20" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• सरकारी लाइसेंस व सॉफ्टवेयर</text>
  </g>

  <!-- Pillar 2: Working Capital -->
  <g transform="translate(330, 130)">
    <rect width="240" height="170" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5" />
    <circle cx="40" cy="40" r="22" fill="rgba(16, 185, 129, 0.2)" />
    <text x="40" y="47" font-size="20" text-anchor="middle" fill="#34D399">🔄</text>
    <text x="75" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2. Working Capital</text>
    <text x="20" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">दैनिक परिचालन चक्र</text>
    <text x="20" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• कच्चा माल (दूध, चायपत्ती)</text>
    <text x="20" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• कर्मचारियों का मासिक वेतन</text>
    <text x="20" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• बिजली, गैस व विविध खर्च</text>
  </g>

  <!-- Pillar 3: Expansion Capital -->
  <g transform="translate(600, 130)">
    <rect width="240" height="170" rx="14" fill="rgba(0, 230, 118, 0.08)" stroke="#00E676" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="rgba(0, 230, 118, 0.2)" />
    <text x="40" y="47" font-size="20" text-anchor="middle" fill="#00E676">🚀</text>
    <text x="75" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#00E676">3. Expansion</text>
    <text x="20" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">भविष्य का विकास</text>
    <text x="20" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• 5 से 10 नई शाखाएं खोलना</text>
    <text x="20" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• बड़ा केंद्रीय वेयरहाउस</text>
    <text x="20" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">• राष्ट्रीय स्तर पर ब्रांडिंग</text>
  </g>
</svg>
