<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#1E3A8A" stroke-width="1.5" rx="8"/>

  <!-- Header -->
  <rect x="25" y="18" width="160" height="22" rx="11" fill="#1E3A8A" fill-opacity="0.6"/>
  <text x="35" y="33" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">LESSON 12 • NOVATION</text>
  
  <text x="25" y="62" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Clearing Corporation & Legal Novation Guarantee</text>
  <text x="25" y="80" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">शून्य काउंटरपार्टी रिस्क: खरीदार के लिए विक्रेता और विक्रेता के लिए खरीदार</text>

  <!-- Content Graphic -->
  <g transform="translate(0, 35)">
    
    <!-- Card 1 -->
    <rect x="25" y="70" width="235" height="295" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="25" y="70" width="235" height="35" rx="8" fill="#0052FF" fill-opacity="0.2"/>
    <text x="40" y="93" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">BUYER ROHAN</text>
    <text x="40" y="130" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">शेयर का खरीदार</text>
    <foreignObject x="38" y="145" width="210" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#94A3B8; font-family:'Segoe UI', sans-serif; font-size:10.5px; line-height:1.5;">
        • रोहन पैसे देता है और शेयर की प्रतीक्षा करता है<br/>• रोहन को नहीं पता कि सामने विक्रेता कौन है<br/>• उसका सीधा कानूनी संबंध क्लियरिंग हाउस से है<br/>• शेयर मिलने की 100% सरकारी गारंटी
      </div>
    </foreignObject>

    <!-- Card 2 -->
    <rect x="282" y="70" width="235" height="295" rx="8" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="282" y="70" width="235" height="35" rx="8" fill="#059669" fill-opacity="0.2"/>
    <text x="297" y="93" fill="#34D399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">CLEARING CORP (NSCCL/ICCL)</text>
    <text x="297" y="130" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">सेंट्रल काउंटरपार्टी (Novation)</text>
    <foreignObject x="295" y="145" width="210" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#94A3B8; font-family:'Segoe UI', sans-serif; font-size:10.5px; line-height:1.5;">
        <div style="text-align:center; padding:15px 0;"><span style="color:#34D399; font-size:14px; font-weight:700;">LEGAL NOVATION</span><br/><span style="color:#94A3B8; font-size:11px;">यदि विक्रेता मुकर भी जाए, तो भी</span><br/><span style="color:#38BDF8; font-size:12px; font-weight:600;">ऑक्शन से शेयर खरीदकर दिए जाएंगे!</span></div>
      </div>
    </foreignObject>

    <!-- Card 3 -->
    <rect x="540" y="70" width="235" height="295" rx="8" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="540" y="70" width="235" height="35" rx="8" fill="#DC2626" fill-opacity="0.2"/>
    <text x="555" y="93" fill="#EF4444" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">SELLER PRIYA</text>
    <text x="555" y="130" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">शेयर का विक्रेता</text>
    <foreignObject x="553" y="145" width="210" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#94A3B8; font-family:'Segoe UI', sans-serif; font-size:10.5px; line-height:1.5;">
        • प्रिया शेयर डिलीवर करती है और नकद पाती है<br/>• यदि प्रिया के पास शेयर न हों (Short Delivery),<br/>• तो क्लियरिंग कॉर्प ऑक्शन से शेयर खरीदेगी<br/>• और सारा जुर्माना प्रिया से वसूला जाएगा
      </div>
    </foreignObject>
  
  </g>

  <!-- Footer Watermark -->
  <line x1="25" y1="422" x2="775" y2="422" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="437" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">TrustPoint Finance Academy • Architectural Educational Series • Verified Benchmark</text>
  <text x="775" y="437" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="end" font-weight="600">SEBI / Regulatory Compliant</text>
</svg>