<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#1E3A8A" stroke-width="1.5" rx="8"/>

  <!-- Header -->
  <rect x="25" y="18" width="160" height="22" rx="11" fill="#1E3A8A" fill-opacity="0.6"/>
  <text x="35" y="33" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">LESSON 20 • GRADUATION SHIELD</text>
  
  <text x="25" y="62" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">The 5 Golden Rules of Stock Market Foundations</text>
  <text x="25" y="80" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">मॉड्यूल 01 का महा-निष्कर्ष: बाजार में आजीवन जीवित रहने और सफल होने का रक्षा कवच</text>

  <!-- Content Graphic -->
  <g transform="translate(0, 35)">
    
    <!-- Card 1 -->
    <rect x="25" y="70" width="235" height="295" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="25" y="70" width="235" height="35" rx="8" fill="#0052FF" fill-opacity="0.2"/>
    <text x="40" y="93" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">RULES 1 & 2: CAPITAL & TREND</text>
    <text x="40" y="130" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">पूंजी और ट्रेंड का सम्मान</text>
    <foreignObject x="38" y="145" width="210" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#94A3B8; font-family:'Segoe UI', sans-serif; font-size:10.5px; line-height:1.5;">
        <b>1. पूंजी संरक्षण सर्वोपरि है:</b><br/>प्रति ट्रेड 1-2% रिस्क ह्यूरिस्टिक का सम्मान करें。<br/><br/><b>2. ट्रेंड आपका सबसे बड़ा मित्र है:</b><br/>नदी के बहाव के साथ तैरें, ट्रेंड के विरुद्ध कभी न जाएं।
      </div>
    </foreignObject>

    <!-- Card 2 -->
    <rect x="282" y="70" width="235" height="295" rx="8" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="282" y="70" width="235" height="35" rx="8" fill="#059669" fill-opacity="0.2"/>
    <text x="297" y="93" fill="#34D399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">RULES 3 & 4: VOLUME & TOOLS</text>
    <text x="297" y="130" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">वॉल्यूम और सादगी की शक्ति</text>
    <foreignObject x="295" y="145" width="210" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#94A3B8; font-family:'Segoe UI', sans-serif; font-size:10.5px; line-height:1.5;">
        <b>3. वॉल्यूम ही सत्य की पुष्टि है:</b><br/>बिना वॉल्यूम ब्रेकआउट केवल जाल है。<br/><br/><b>4. इंडिकेटर्स सहायक हैं, मालिक नहीं:</b><br/>प्राइस एक्शन राजा है; इंडिकेटर सूप से बचें।
      </div>
    </foreignObject>

    <!-- Card 3 -->
    <rect x="540" y="70" width="235" height="295" rx="8" fill="url(#cardGrad)" stroke="#FBBF24" stroke-width="1.5"/>
    <rect x="540" y="70" width="235" height="35" rx="8" fill="#D97706" fill-opacity="0.2"/>
    <text x="555" y="93" fill="#FBBF24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">RULE 5: DISCIPLINE & PATIENCE</text>
    <text x="555" y="130" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">अनुशासन ही अंतिम बढ़त है</text>
    <foreignObject x="553" y="145" width="210" height="200">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#94A3B8; font-family:'Segoe UI', sans-serif; font-size:10.5px; line-height:1.5;">
        <b>5. कोई Speculation या शॉर्टकट नहीं:</b><br/>गणित, स्थिति का सही आकार (Position Sizing), और अपनी भावनाओं पर विजय ही वित्तीय स्वतंत्रता का सच्चा मार्ग है।
      </div>
    </foreignObject>
  
  </g>

  <!-- Footer Watermark -->
  <line x1="25" y1="422" x2="775" y2="422" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="437" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">TrustPoint Finance Academy • Architectural Educational Series • Verified Benchmark</text>
  <text x="775" y="437" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="end" font-weight="600">SEBI / Regulatory Compliant</text>
</svg>