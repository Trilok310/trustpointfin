<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="880" height="300" rx="18" fill="url(#engGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <text x="50" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Business का मूल सार: समस्या समाधान से लाभ तक</text>

  <!-- Cycle blocks -->
  <g transform="translate(50, 90)">
    <!-- Box 1 -->
    <rect width="230" height="170" rx="14" fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="25" y="45" font-size="26">❓</text>
    <text x="25" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1. वास्तविक समस्या</text>
    <text x="25" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">लोगों की किसी परेशानी या</text>
    <text x="25" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">आवश्यकता की पहचान</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 305 175 L 335 175" stroke="#38BDF8" stroke-width="3" />
  <polygon points="335,168 345,175 335,182" fill="#38BDF8" />

  <!-- Box 2 -->
  <g transform="translate(360, 90)">
    <rect width="230" height="170" rx="14" fill="rgba(0, 230, 118, 0.08)" stroke="#00E676" stroke-width="1.5" />
    <text x="25" y="45" font-size="26">💡</text>
    <text x="25" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#00E676">2. समाधान व उत्पाद</text>
    <text x="25" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">विश्वसनीय वस्तु या सेवा</text>
    <text x="25" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">जो समस्या को हल करे</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 615 175 L 645 175" stroke="#00E676" stroke-width="3" />
  <polygon points="645,168 655,175 645,182" fill="#00E676" />

  <!-- Box 3 -->
  <g transform="translate(670, 90)">
    <rect width="190" height="170" rx="14" fill="rgba(251, 191, 36, 0.08)" stroke="#FBBF24" stroke-width="1.5" />
    <text x="25" y="45" font-size="26">🤝</text>
    <text x="25" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FBBF24">3. मूल्य लेन-देन</text>
    <text x="25" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">संतुष्ट ग्राहक द्वारा</text>
    <text x="25" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">भुगतान ➔ Net Profit</text>
  </g>
</svg>
