<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <linearGradient id="certHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadowL04" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradL04)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Header -->
  <text x="600" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#FFFFFF">
    एक शेयर का वास्तविक अर्थ और कानूनी ढांचा (Share Architecture &amp; Rights)
  </text>
  <text x="600" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" fill="#94A3B8">
    कंपनी एक स्वतंत्र कानूनी निकाय (Separate Legal Entity) है; शेयरधारक कंपनी में आनुपातिक स्वामित्व हित (Ownership Interest) रखता है
  </text>

  <!-- LEFT: THE CORPORATE ENTITY (कंपनी का स्वरूप) -->
  <g transform="translate(60, 95)" filter="url(#shadowL04)">
    <rect width="320" height="285" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <rect width="320" height="40" rx="12" fill="url(#certHeaderGrad)" />
    <rect y="28" width="320" height="12" fill="url(#certHeaderGrad)" />
    <text x="160" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      🏢 कंपनी (The Corporate Entity)
    </text>

    <text x="20" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93C5FD">
      1. स्वतंत्र कानूनी अस्तित्व (Separate Entity):
    </text>
    <text x="20" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#CBD5E1">
      फैक्ट्री, मशीनें और बैंक बैलेंस कंपनी की अपनी संपत्ति हैं।
    </text>

    <text x="20" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93C5FD">
      2. पूंजी का विभाजन (Equity Shares):
    </text>
    <text x="20" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#CBD5E1">
      कुल इक्विटी पूंजी लाखों समान इकाइयों (Shares) में बंटी होती है।
    </text>

    <rect x="20" y="180" width="280" height="85" rx="8" fill="#0B1329" stroke="#334155" stroke-width="1" />
    <text x="30" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">
      ⚠️ महत्वपूर्ण कानूनी भेद:
    </text>
    <text x="30" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">
      शेयरधारक भौतिक संपत्तियों का प्रत्यक्ष मालिक नहीं होता, बल्कि कंपनी में स्वामित्व हित रखता है।
    </text>
  </g>

  <!-- CONNECTOR ARROW -->
  <g transform="translate(390, 220)">
    <circle cx="20" cy="0" r="18" fill="#1E293B" stroke="#00E676" stroke-width="2" />
    <path d="M 14 -6 L 26 0 L 14 6" fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="20" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#00E676">
      1 Share
    </text>
  </g>

  <!-- RIGHT: 3 PILLARS OF SHAREHOLDER RIGHTS -->
  <g transform="translate(440, 95)" filter="url(#shadowL04)">
    <rect width="700" height="285" rx="12" fill="#1E293B" stroke="#00E676" stroke-width="1.5" />
    <rect width="700" height="40" rx="12" fill="#064E3B" fill-opacity="0.8" />
    <rect y="28" width="700" height="12" fill="#064E3B" fill-opacity="0.8" />
    <text x="350" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#34D399">
      📜 1 शेयर के साथ जुड़े 3 मौलिक अधिकार (Core Shareholder Rights)
    </text>

    <!-- Pillar 1: Proportional Ownership Interest -->
    <g transform="translate(20, 55)">
      <rect width="205" height="210" rx="8" fill="#0B1329" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="102" cy="35" r="20" fill="#1E3A8A" fill-opacity="0.4" />
      <text x="102" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle" fill="#60A5FA">🏛️</text>
      <text x="102" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#93C5FD">
        1. Fractional Interest
      </text>
      <text x="102" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">
        आनुपातिक स्वामित्व हित
      </text>
      <text x="15" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">
        • कंपनी के कुल जारी शेयरों में से आपका निश्चित प्रतिशत हिस्सा।
      </text>
      <text x="15" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">
        • कंपनी की ग्रोथ के साथ आपके शेयर का आर्थिक मूल्य बढ़ता है।
      </text>
    </g>

    <!-- Pillar 2: Voting & Governance Rights -->
    <g transform="translate(245, 55)">
      <rect width="205" height="210" rx="8" fill="#0B1329" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="102" cy="35" r="20" fill="#065F46" fill-opacity="0.4" />
      <text x="102" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle" fill="#34D399">🗳️</text>
      <text x="102" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#6EE7B7">
        2. Voting Rights
      </text>
      <text x="102" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">
        वोटिंग व गवर्नेंस अधिकार
      </text>
      <text x="15" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">
        • AGM (वार्षिक आम बैठक) में महत्वपूर्ण प्रस्तावों पर वोट देना।
      </text>
      <text x="15" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">
        • बोर्ड ऑफ डायरेक्टर्स और ऑडिटर्स की नियुक्ति में भागीदारी।
      </text>
    </g>

    <!-- Pillar 3: Residual Economic Claim -->
    <g transform="translate(470, 55)">
      <rect width="210" height="210" rx="8" fill="#0B1329" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="105" cy="35" r="20" fill="#854D0E" fill-opacity="0.4" />
      <text x="105" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle" fill="#FBBF24">💰</text>
      <text x="105" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FDE68A">
        3. Residual Claim
      </text>
      <text x="105" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">
        अवशिष्ट आर्थिक दावा
      </text>
      <text x="15" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">
        • यदि कंपनी लाभांश (Dividend) घोषित करे, तो प्राप्त करने का हक।
      </text>
      <text x="15" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">
        • समापन (Liquidation) पर सभी कर्ज चुकाने के बाद बचे फंड पर हक।
      </text>
    </g>
  </g>
</svg>
