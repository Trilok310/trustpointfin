<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00E676" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="20" y="20" width="960" height="340" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />

  <!-- Subtitle notice -->
  <text x="50" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="1">ILLUSTRATIVE EXAMPLE • NOT ACTUAL COMPANY DATA</text>

  <!-- 3 Mathematical Pillars -->
  <!-- Revenue Box -->
  <g transform="translate(50, 95)">
    <rect width="260" height="220" rx="16" fill="rgba(0, 230, 118, 0.06)" stroke="#00E676" stroke-width="2" filter="url(#glowGreen)" />
    <text x="30" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#00E676">REVENUE (Top-line)</text>
    <text x="30" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A7F3D0">दुकान की कुल बिक्री</text>
    <text x="30" y="140" font-family="'Outfit', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">₹10,00,000</text>
    <text x="30" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">ग्राहकों से प्राप्त कुल राशि</text>
  </g>

  <!-- Minus sign -->
  <circle cx="355" cy="205" r="22" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="2" />
  <text x="355" y="214" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#EF4444">−</text>

  <!-- Costs Box -->
  <g transform="translate(395, 95)">
    <rect width="260" height="220" rx="16" fill="rgba(239, 68, 68, 0.06)" stroke="#EF4444" stroke-width="2" />
    <text x="30" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#EF4444">COSTS (खर्चे व लागत)</text>
    <text x="30" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FECACA">कच्चा माल, किराया व वेतन</text>
    <text x="30" y="140" font-family="'Outfit', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">₹7,00,000</text>
    <text x="30" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">संचालन में लगा कुल खर्च</text>
  </g>

  <!-- Equals sign -->
  <circle cx="700" cy="205" r="22" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2" />
  <text x="700" y="214" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#38BDF8">=</text>

  <!-- Profit Box -->
  <g transform="translate(740, 95)">
    <rect width="220" height="220" rx="16" fill="linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(14, 165, 233, 0.05) 100%)" stroke="#38BDF8" stroke-width="2.5" />
    <text x="25" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">NET PROFIT</text>
    <text x="25" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#BAE6FD">शुद्ध बचा मुनाफा</text>
    <text x="25" y="140" font-family="'Outfit', sans-serif" font-size="42" font-weight="800" fill="#38BDF8">₹3,00,000</text>
    <text x="25" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FBBF24">मार्जिन: 30%</text>
  </g>
</svg>
