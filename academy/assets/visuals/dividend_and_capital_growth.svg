<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTwin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <linearGradient id="capGainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowTwin" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradTwin)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Header -->
  <text x="600" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#FFFFFF">
    शेयरधारक रिटर्न के दो इंजन: Capital Appreciation और Dividend
  </text>
  <text x="600" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" fill="#94A3B8">
    कंपनी की लंबी अवधि की संपत्ति-सृजन यात्रा में पूंजी वृद्धि और घोषित लाभांश का दोहरा आर्थिक प्रभाव
  </text>

  <!-- LEFT: ENGINE 1 - CAPITAL APPRECIATION -->
  <g transform="translate(60, 95)" filter="url(#shadowTwin)">
    <rect width="500" height="285" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <rect width="500" height="42" rx="14" fill="url(#capGainGrad)" />
    <rect y="28" width="500" height="14" fill="url(#capGainGrad)" />
    <text x="250" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      🚀 इंजन 1: Capital Appreciation (पूंजीगत लाभ)
    </text>

    <!-- Visual Bars: Price Growth -->
    <g transform="translate(30, 65)">
      <rect x="0" y="80" width="80" height="80" rx="6" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5" />
      <text x="40" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#93C5FD">वर्ष 1</text>
      <text x="40" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#FFFFFF">₹200</text>

      <!-- Arrow -->
      <path d="M 95 120 L 125 100" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 120 95 L 128 100 L 120 106" fill="#60A5FA" />

      <rect x="140" y="30" width="80" height="130" rx="6" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5" />
      <text x="180" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#BFDBFE">वर्ष 3</text>
      <text x="180" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">₹350</text>
      <text x="180" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#34D399">+75%</text>

      <!-- Explanation Box -->
      <g transform="translate(240, 20)">
        <rect width="210" height="145" rx="8" fill="#0B1329" stroke="#334155" stroke-width="1" />
        <text x="15" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#93C5FD">
          यह लाभ कैसे बनता है?
        </text>
        <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">
          • कंपनी मुनाफे को री-इन्वेस्ट कर नए स्टोर व फैक्ट्रियां लगाती है।
        </text>
        <text x="15" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">
          • भविष्य की कमाई बढ़ने पर शेयर का बाजार भाव बढ़ता है।
        </text>
        <text x="15" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#60A5FA">
          (Unrealized जब तक शेयर न बेचें)
        </text>
      </g>
    </g>

    <text x="250" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#94A3B8">
      लंबी अवधि में संपदा निर्माण का 80-90% हिस्सा पूंजीगत लाभ से आता है।
    </text>
  </g>

  <!-- RIGHT: ENGINE 2 - DIVIDEND CASH FLOW -->
  <g transform="translate(640, 95)" filter="url(#shadowTwin)">
    <rect width="500" height="285" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <rect width="500" height="42" rx="14" fill="url(#divGrad)" />
    <rect y="28" width="500" height="14" fill="url(#divGrad)" />
    <text x="250" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      💵 इंजन 2: Dividend Payout (घोषित लाभांश)
    </text>

    <!-- Visual Cash Flow Flow -->
    <g transform="translate(30, 65)">
      <!-- Cash Flow Icon Card -->
      <rect x="0" y="20" width="190" height="155" rx="8" fill="#0B1329" stroke="#047857" stroke-width="1.5" />
      <circle cx="95" cy="55" r="22" fill="#065F46" />
      <text x="95" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">₹</text>
      
      <text x="95" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#6EE7B7">
        नकद बैंक ट्रांसफर
      </text>
      <text x="95" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#FFFFFF">
        ₹10 प्रति शेयर
      </text>
      <text x="95" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#94A3B8">
        500 शेयर = ₹5,000 नकद
      </text>

      <!-- Explanation Box -->
      <g transform="translate(210, 20)">
        <rect width="240" height="155" rx="8" fill="#0B1329" stroke="#334155" stroke-width="1" />
        <text x="15" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#6EE7B7">
          लाभांश के मुख्य सिद्धांत:
        </text>
        <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">
          • कंपनी द्वारा घोषित, जो पात्र शेयरधारकों को उनके होल्डिंग अनुपात में मिलता है।
        </text>
        <text x="15" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">
          • शेयर बेचे बिना निवेशक के बैंक खाते में आने वाला वास्तविक नियमित कैश फ्लो।
        </text>
        <text x="15" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34D399">
          (Realized Cash Flow)
        </text>
      </g>
    </g>

    <text x="250" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#34D399">
      कुल रिटर्न = Unrealized Capital Gain + Dividend Received (Pre-tax)
    </text>
  </g>
</svg>
