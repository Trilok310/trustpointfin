name: Auto Post Financial Insight

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    - cron: '20 3 * * *'   # 8:50 AM IST
    - cron: '50 3 * * *'   # 9:20 AM IST
    - cron: '30 11 * * *'  # 5:00 PM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  post-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          echo "✅ npm install done."

      - name: Run Article Poster Script (Step 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: |
          for i in 1 2 3 4 5; do
            node scripts/post-article.js && exit 0 || echo "⚠️ Script crashed (Attempt $i/5). Retrying in 60 seconds..."
            sleep 60
          done
          echo "❌ Script failed after 5 attempts."
          exit 1

      - name: Run Presentation Engine (Step 2 - Generate Carousel)
        run: |
          npx puppeteer browsers install chrome
          node scripts/generate-carousel.js

      - name: Commit and Push New Article and Slides (Step 3)
        run: |
          git config --global user.name "TrustPointFin AutoBot"
          git config --global user.email "autobot@trustpointfin.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Auto-post: New Financial Insight"
          git push
          echo "⏳ Waiting 15 seconds for GitHub raw CDN to update..."
          sleep 15

      - name: Publish to Meta (Step 4 - Auto Publish to IG/FB)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          node scripts/post-social.js
