name: Auto Post Financial Insight

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # 1 post per day per user request
    - cron: '20 3 * * *'   # 8:50 AM IST
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: "production-article-pipeline"
  cancel-in-progress: false

jobs:
  post-article:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Durable Staging State
        uses: actions/cache/restore@v4
        with:
          path: .staging/
          key: staging-state-${{ github.run_id }}
          restore-keys: |
            staging-state-

      - name: Install Dependencies
        run: |
          npm install --no-fund --no-audit --loglevel=error
          echo "✅ npm install done."

      - name: Generate Website Article (Step 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_PAID_MODEL: gemini-3.7-flash
          GEMINI_FREE_MODEL: gemini-3.6-flash
        run: |
          node scripts/post-article.js

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-state
          path: |
            .staging/
            *.tmp.html
            *.tmp.xml
            .pending_article.json

      - name: Commit and Push Website Article (Step 2)
        run: |
          git config --global user.name "TrustPointFin AutoBot"
          git config --global user.email "autobot@trustpointfin.org"
          git add *.html insights.html sitemap.xml .pending_article.json
          git diff --staged --quiet || git commit -m "🤖 Auto-post: New Financial Insight Published"
          git push

      - name: Confirm Publication & Write State (Step 3)
        run: |
          node scripts/confirm-publish.js

      - name: Prepare Social Source and Generate Content (Step 4)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
          GEMINI_PAID_MODEL: gemini-3.7-flash
          GEMINI_FREE_MODEL: gemini-3.6-flash
        run: |
          node scripts/prepare-social.js

      - name: Check Puppeteer & System Chrome
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/check-puppeteer.js

      - name: Render Carousel Slides (Step 5)
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          node scripts/generate-carousel.js

      - name: Commit and Push Social Assets and Calendar (Step 6)
        run: |
          git config --global user.name "TrustPointFin AutoBot"
          git config --global user.email "autobot@trustpointfin.org"
          git add slides/ content_calendar.md latest_social_media.md latest_slides.json .current_topic_state.json
          git diff --staged --quiet || git commit -m "📸 Auto-post: Social Media Assets & Calendar Update"
          git push
          echo "⏳ Assets Pushed! Waiting 5 minutes (300s) before posting to Meta to ensure GitHub Pages deployment is live..."
          sleep 300

      - name: Publish to Meta (Step 7)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          node scripts/post-social.js

      - name: Save Durable Staging State (Always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .staging/
          key: staging-state-${{ github.run_id }}-${{ github.run_attempt }}
