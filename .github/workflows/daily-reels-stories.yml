name: Auto Post Daily Reel and Story

on:
  schedule:
    # 10:00 AM IST (4:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  post-reel-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          architecture: ''
          download-version: 'latest'

      - name: Install Dependencies
        run: |
          npm install
          echo "✅ npm install done."

      - name: Run Generators (Step 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node node_modules/puppeteer/install.mjs
          node scripts/generate-story.js
          node scripts/generate-reel.js

      - name: Stitch Reel Video with FFmpeg (Step 2)
        run: |
          # Try to use a custom background music file if it exists in the repo, otherwise download a generic one
          if [ ! -f "bg.mp3" ]; then
            echo "📥 Downloading royalty-free background music..."
            wget -qO bg.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" || true
          fi
          
          # If we successfully have an MP3, use it. Otherwise, fallback to silent audio.
          if [ -s "bg.mp3" ]; then
            echo "🎵 Mixing in background music..."
            # -stream_loop -1 loops the audio. -shortest stops when the video ends (12s).
            ffmpeg -y -framerate 1/4 -i reel_slides/reel_%d.jpg -stream_loop -1 -i bg.mp3 -c:v libx264 -c:a aac -r 30 -pix_fmt yuv420p -shortest reel.mp4
          else
            echo "🔇 No music found. Using silent audio..."
            ffmpeg -y -framerate 1/4 -i reel_slides/reel_%d.jpg -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -c:v libx264 -c:a aac -r 30 -pix_fmt yuv420p -shortest reel.mp4
          fi
          echo "✅ Reel video generated successfully."

      - name: Commit and Push Assets (Step 3)
        run: |
          git config --global user.name "TrustPointFin AutoBot"
          git config --global user.email "autobot@trustpointfin.com"
          git add story.jpg reel.mp4 reel_slides/
          git diff --staged --quiet || git commit -m "🤖 Auto-post: New Daily Story and Reel"
          git push
          echo "⏳ Assets pushed to GitHub! Waiting 5 minutes (300s) for GitHub CDN to update..."
          sleep 300

      - name: Publish to Meta (Step 4)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          node scripts/post-story.js
          node scripts/post-reel.js
