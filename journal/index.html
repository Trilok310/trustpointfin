          colors: {
            zella: {
              bg: '#090D16',
              panel: '#111726',
              card: '#161E31',
              border: '#222F49',

  <style>
    body {
      background-color: #090D16;
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090D16; }
    ::-webkit-scrollbar-thumb { background: #222F49; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }

    .glass-card {
      background: linear-gradient(145deg, rgba(22, 30, 49, 0.92), rgba(17, 23, 38, 0.96));
      border: 1px solid rgba(99, 102, 241, 0.16);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .zella-gradient-text {
      background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #34D399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .zella-btn-primary {
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      transition: all 0.2s ease;
    }
    .zella-btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.45);
    }
    .calendar-cell {
      min-height: 92px;
      transition: all 0.15s ease;
    }
    .calendar-cell:hover {
      transform: translateY(-2px);
      border-color: #6366F1;
    }
  </style>

<body class="antialiased selection:bg-indigo-500 selection:text-white">
